name: xenium_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.2
  - r-data.table
  - r-ggplot2
  - r-cowplot
  - r-patchwork
  - r-magick
  - r-arrow
  - r-fnn
  - r-here
  - r-png
  - r-jsonlite
  - r-ggalluvial
  - r-scales
  - r-rcolorbrewer
  - r-irlba
  - r-uwot
  - r-igraph
  - r-leiden
  - r-future
  - r-remotes
  - r-biocmanager
  # System libs needed by Giotto / CellChat / sf
  - libcurl
  - openssl
  - cairo
  - libxml2
  - hdf5
  - imagemagick
  - tifffile
  # Python interop
  - python>=3.10
  - r-reticulate
# Bioconductor + GitHub-only packages — install in R with:
#   BiocManager::install(c("Giotto", "GiottoClass", "CellChat"))
#   remotes::install_github("saezlab/liana")
